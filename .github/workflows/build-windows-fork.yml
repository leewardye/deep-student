# Fork 云端构建：Windows NSIS 安装包（无签名）
#
# 用途：在 fork 仓库里把 feat/im-channels 分支编译成可安装的桌面端。
# 与官方 release 流水线的差别：
#   - 跳过 Authenticode 代码签名（无证书 secrets，安装时 SmartScreen 会提示，仍可运行）
#   - updater 密钥用 CI 内生成的临时密钥（不影响本地使用，只是不能用官方自动更新）
#   - 不上传 Sentry / R2，产物以 workflow artifact 形式下载
#
# 触发：push 到 feat/im-channels，或手动 workflow_dispatch。
# 首次构建无缓存，预计 1.5~3 小时；后续构建命中 rust-cache/sccache 会快很多。

name: Build Windows (fork)

on:
  push:
    branches: [feat/im-channels]
  workflow_dispatch: {}

concurrency:
  group: build-windows-fork-${{ github.ref }}
  cancel-in-progress: true

env:
  DEEP_STUDENT_BUILD_NUMBER: '14639'
  NODE_OPTIONS: '--max-old-space-size=8192'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_IDLE_TIMEOUT: '0'
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  SENTRY_UPLOAD_ENABLED: 'false'

jobs:
  build:
    name: Build NSIS installer (unsigned)
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust 1.98.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust cache (target dir)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          cache-all-crates: 'true'

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Generate throwaway updater signing key
        shell: bash
        env:
          UPDATER_KEY_PASSWORD: 'ci-build-only'
        run: |
          cd src-tauri
          npx --yes @tauri-apps/cli signer generate -w ci-updater.key --password "$UPDATER_KEY_PASSWORD" --force
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat ci-updater.key)" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build (vite + tauri)
        shell: bash
        run: |
          export RUSTC_WRAPPER=sccache
          # 只打 NSIS：tauri.conf.json 的 targets 为 "all" 时 Windows 会连 MSI 一起打，
          # 而 WiX light.exe 在 CI 上反复失败（且 Collect artifacts 不收 .msi）
          set -o pipefail
          npx tauri build --bundles nsis 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors (annotations)
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          # cargo/tauri 错误行带 ANSI 颜色码（error 与 [E0502]: 之间有 \x1b[0m），
          # 先剥码再匹配，否则 grep 抓不到真正的编译错误
          sed -r 's/\x1b\[[0-9;]*[mGKH]//g' "$LOG" > /tmp/clean.log
          grep -nE "error(\[E[0-9]+\])?:|error: |error during|LNK[0-9]+|panicked|could not compile|build failed|Failure reason" /tmp/clean.log | tail -30 > /tmp/errs.txt
          if [ -s /tmp/errs.txt ]; then
            while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-500)"
            done < /tmp/errs.txt
          else
            echo "::error::No error lines matched; last 40 lines follow"
            tail -40 /tmp/clean.log | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-500)"
            done
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-upload
          find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.sig" \) -exec cp {} dist-upload/ \;
          ls -la dist-upload/

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepStudent-Windows-v${{ steps.ver.outputs.version }}-unsigned
          path: dist-upload/
          if-no-files-found: error
          retention-days: 14
